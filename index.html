<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Consumo do Carro Elétrico</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>
  <header>
    <h1>⚡ Consumo do Carro Elétrico</h1>
    <p id="status">Carregando…</p>
  </header>

  <main>
    <section id="resumo" class="cards"></section>

    <section>
      <div class="titulo-secao">
        <h2>Consumo por mês</h2>
        <div class="alternar" role="group" aria-label="Visão do gráfico">
          <button data-visao="total" aria-pressed="true">Total</button>
          <button data-visao="carro" aria-pressed="false">Carro</button>
        </div>
      </div>
      <div class="grafico-box"><canvas id="grafico"></canvas></div>
    </section>

    <section id="area-lancar" hidden>
      <div class="titulo-secao">
        <h2>Lançar leitura</h2>
        <span class="usuario"><span id="usuario"></span> · <button id="sair" class="link">sair</button></span>
      </div>
      <form id="form-leitura">
        <label>Data da leitura <input id="data" type="date" required></label>
        <label>Medidor da casa (kWh acumulado) <input id="kwh-total" type="number" step="0.01" min="0" inputmode="decimal" required></label>
        <label>Carregador do carro (kWh acumulado) <input id="kwh-carro" type="number" step="0.01" min="0" inputmode="decimal" required></label>
        <label>Valor da conta (R$) <input id="valor" type="number" step="0.01" min="0" inputmode="decimal" placeholder="vazio só na 1ª leitura"></label>
        <button type="submit">Salvar</button>
        <p id="msg-leitura" class="msg"></p>
      </form>
    </section>

    <section>
      <div class="titulo-secao">
        <h2>Leituras</h2>
        <button id="exportar" class="secundario">Exportar CSV</button>
      </div>
      <div class="tabela-box">
        <table>
          <thead>
            <tr>
              <th>Data</th><th>Medidor</th><th>Carregador</th><th>Consumo total</th><th>Consumo carro</th>
              <th>Conta</th><th>Custo carro</th><th>Dias</th><th>kWh/dia (total / carro)</th><th></th>
            </tr>
          </thead>
          <tbody id="tabela-corpo"></tbody>
        </table>
      </div>
    </section>

    <section id="area-login">
      <h2>Entrar para lançar leituras</h2>
      <form id="form-login">
        <input id="email" type="email" placeholder="seu@email.com" autocomplete="username" required>
        <input id="senha" type="password" placeholder="senha" autocomplete="current-password" required>
        <button type="submit">Entrar</button>
      </form>
      <p id="msg-login" class="msg"></p>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>

<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Consumo do Carro Elétrico</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1"></script>
</head>
<body>
  <header>
    <h1>⚡ Consumo do Carro Elétrico</h1>
    <p id="status">Carregando…</p>
  </header>

  <main>
    <section id="resumo" class="cards dados" hidden></section>

    <section class="dados" hidden>
      <div class="titulo-secao">
        <h2>Consumo por mês</h2>
        <div class="alternar" role="group" aria-label="Visão do gráfico">
          <button data-visao="mes" aria-pressed="true">kWh/mês</button>
          <button data-visao="dia" aria-pressed="false">kWh/dia</button>
        </div>
      </div>
      <div class="grafico-box"><canvas id="grafico"></canvas></div>
    </section>

    <section id="area-lancar" hidden>
      <div class="titulo-secao">
        <h2>Lançar leitura</h2>
        <span class="usuario"><span id="usuario"></span> · <button id="sair" class="link">sair</button></span>
      </div>
      <form id="form-leitura">
        <label>Data da leitura <input id="data" type="date" required></label>
        <label>kWh total da fatura <input id="kwh-total" type="number" step="0.01" min="0" inputmode="decimal" required></label>
        <label>Carregador do carro (kWh acumulado) <input id="kwh-carro" type="number" step="0.01" min="0" inputmode="decimal" required></label>
        <label>Valor da conta (R$) <input id="valor" type="number" step="0.01" min="0" inputmode="decimal" placeholder="vazio só na 1ª leitura"></label>
        <label>Odômetro do carro (km) <input id="odometro" type="number" step="1" min="0" inputmode="numeric" placeholder="opcional"></label>
        <div class="botoes">
          <button type="submit" id="salvar">Salvar</button>
          <button type="button" id="cancelar-edicao" class="secundario" hidden>Cancelar</button>
        </div>
        <p id="msg-leitura" class="msg"></p>
      </form>

      <h3>Comparação com gasolina</h3>
      <form id="form-gasolina">
        <label>Preço da gasolina (R$/L) <input id="gas-preco" type="number" step="0.01" min="0.01" inputmode="decimal" required></label>
        <label>Consumo do carro a gasolina (km/L) <input id="gas-km-l" type="number" step="0.1" min="0.1" inputmode="decimal" required></label>
        <div class="botoes"><button type="submit" id="salvar-gasolina">Salvar</button></div>
        <p id="msg-gasolina" class="msg"></p>
      </form>
    </section>

    <section class="dados" hidden>
      <div class="titulo-secao">
        <h2>Leituras</h2>
        <button id="exportar" class="secundario">Exportar CSV</button>
      </div>
      <div class="tabela-box">
        <table>
          <thead>
            <tr>
              <th>Data</th><th>kWh total</th><th>Carregador</th><th>Consumo carro</th>
              <th>Conta</th><th>Custo carro</th><th>Dias</th><th>kWh/dia (total / carro)</th>
              <th>Odômetro</th><th>km</th><th>kWh/100 km</th><th></th>
            </tr>
          </thead>
          <tbody id="tabela-corpo"></tbody>
        </table>
      </div>
    </section>

    <section id="area-login" class="tela-login" hidden>
      <div class="login-card">
        <div class="login-icone" aria-hidden="true">⚡</div>
        <h2>Consumo do Carro Elétrico</h2>
        <p class="login-sub">Entre para ver e lançar as leituras.</p>
        <form id="form-login">
          <label>E-mail <input id="email" type="email" placeholder="seu@email.com" autocomplete="username" required></label>
          <label>Senha <input id="senha" type="password" autocomplete="current-password" required></label>
          <button type="submit">Entrar</button>
          <p id="msg-login" class="msg"></p>
        </form>
      </div>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>

# Mantém o projeto do Supabase ativo.
# No plano grátis, o Supabase pausa o projeto depois de ~7 dias sem uso.
# Este workflow faz uma consulta simples à API a cada 3 dias. Sem login, o RLS
# devolve uma lista vazia: nenhum dado é lido nem alterado.
# Se a consulta falhar (projeto pausado ou fora do ar), o job falha e o GitHub
# avisa por e-mail.
name: Manter Supabase ativo

on:
  schedule:
    - cron: "17 12 */3 * *" # a cada 3 dias, 09:17 de Brasília (12:17 UTC)
  workflow_dispatch: # botão "Run workflow" para testar na hora

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Consultar a API do Supabase
        run: |
          # URL e chave pública vêm do js/config.js (a mesma que o site já usa)
          URL=$(sed -n 's/.*SUPABASE_URL *= *"\([^"]*\)".*/\1/p' js/config.js)
          KEY=$(sed -n 's/.*SUPABASE_ANON_KEY *= *"\([^"]*\)".*/\1/p' js/config.js)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "Não achei SUPABASE_URL/SUPABASE_ANON_KEY em js/config.js"; exit 1
          fi
          STATUS=$(curl -sS -o resposta.txt -w "%{http_code}" --max-time 30 \
            "$URL/rest/v1/leituras?select=id&limit=1" -H "apikey: $KEY")
          echo "HTTP $STATUS: $(head -c 200 resposta.txt)"
          if [ "$STATUS" != "200" ]; then
            echo "::error::O Supabase respondeu HTTP $STATUS. O projeto pode estar pausado: abra o painel do Supabase e clique em Restore."
            exit 1
          fi
